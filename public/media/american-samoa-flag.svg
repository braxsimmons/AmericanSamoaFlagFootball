<!--
  Flag of American Samoa. Public domain (a government flag; the design is not
  under copyright). Drawn here rather than fetched so it stays crisp at any
  size and adds no external request.

  Adopted 17 April 1960. The bald eagle carries a uatogi (war club) and a fue
  (fly-whisk) — the symbols of the chiefly authority of the matai.
-->
